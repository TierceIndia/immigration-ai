version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # A single PR for the routine bumps keeps review focused on behaviour,
      # not on a stream of one-line lockfile changes.
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
        exclude-patterns: ["@playwright/*", "@axe-core/*", "axe-core"]
      # Playwright and axe must move together with the browser revision the
      # CI installs; separate PRs are easier to review and to revert.
      browser-testing:
        patterns: ["@playwright/*", "@axe-core/*", "axe-core"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
