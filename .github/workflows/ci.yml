name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (hermetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile the package
        run: python -m compileall -q src

      # The default suite makes no network calls, starts no browser and needs
      # no database: every external boundary is faked. Live checks are opt-in
      # markers (PYTEST_LLM_LIVE, BROWSER_LIVE, POSTGRES_E2E).
      - name: Unit and contract tests
        run: python -m pytest -q

  postgres-e2e:
    name: PostgreSQL end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: immigration
          POSTGRES_PASSWORD: immigration
          POSTGRES_DB: immigration_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U immigration -d immigration_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://immigration:immigration@localhost:5432/immigration_e2e
      POSTGRES_E2E: "1"
      POSTGRES_E2E_URL: postgresql+psycopg2://immigration:immigration@localhost:5432/immigration_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migrate the dedicated e2e database
        run: alembic upgrade head

      # These write and delete real rows (and briefly disable append-only
      # triggers), which is safe only because the guard in tests/e2e/conftest.py
      # refuses the shared "immigration" database outright.
      - name: End-to-end tests
        run: python -m pytest tests/e2e tests/services/test_search_service.py -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Every API call is mocked in the browser; no backend or database is
      # needed. The suite also asserts no serious or critical axe violations.
      - name: Browser tests
        run: npm run test:e2e
        env:
          CI: "1"

  containers:
    name: Container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin UI image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
