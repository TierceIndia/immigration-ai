services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: immigration
      POSTGRES_USER: immigration
      POSTGRES_PASSWORD: immigration_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immigration"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://immigration:immigration_dev@postgres:5432/immigration
      JWT_SECRET_KEY: change-me-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "1440"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn src.api.main:create_app --factory --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
