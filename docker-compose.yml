services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: immigration
      POSTGRES_USER: immigration
      POSTGRES_PASSWORD: immigration_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immigration"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    # Chromium needs more than the default 64MB /dev/shm to run without crashing
    # (well-documented Chromium-in-Docker requirement). We bump it here rather
    # than passing --disable-dev-shm-usage at runtime; see Docker docs on /dev/shm.
    shm_size: '1gb'
    environment:
      DATABASE_URL: postgresql+psycopg2://immigration:immigration_dev@postgres:5432/immigration
      JWT_SECRET_KEY: change-me-in-production
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "1440"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-System Administrator}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      ENABLE_SCHEDULER: "true"
      GOVERNMENT_SYNC_HOUR_UTC: "3"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gpt-4o-mini}
    depends_on:
      postgres:
        condition: service_healthy
    # Dockerfile's ENTRYPOINT (docker-entrypoint.sh) starts Xvfb and sets DISPLAY
    # before running this command, so browser_fetcher.py's headless=False
    # Chromium has a real X display available.
    command: >
      sh -c "alembic upgrade head && python src/seed_registry.py &&
      uvicorn src.api.main:create_app --factory --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
