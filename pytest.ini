[pytest]
markers =
    integration: tests that call the real OpenAI API (skipped unless PYTEST_LLM_LIVE=1 and OPENAI_API_KEY set)
    postgres_e2e: tests against the live dev PostgreSQL (skipped unless POSTGRES_E2E=1)
    browser_live: tests that launch a real headless Chromium process (skipped unless BROWSER_LIVE=1)