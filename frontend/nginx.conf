# Serves the built admin UI and proxies the API on the same origin.
# Preserve the TLS scheme supplied by the TLS terminator (Caddy in production)
# instead of overwriting it with the internal HTTP hop's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the server version.
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'none'; connect-src 'self'" always;

    # The UI is a single-page app: every unknown path is a client-side route,
    # not a missing file, so it must be answered with index.html rather than
    # 404. Real missing assets under /assets/ still 404 (see below), which is
    # what makes a broken deploy visible instead of silently serving HTML
    # where a script was expected.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints asset filenames, so a hit is immutable and a miss is a
    # genuine error.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        # The entry point must never be cached, or a browser keeps loading the
        # previous deploy's asset names after an update.
        add_header Cache-Control "no-store";
    }

    # Same-origin API: no CORS, no second origin for the JWT to travel to.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # A government fetch triggered from the UI ("Run now") answers 202
        # immediately, but a sync status poll must not be cut off mid-run.
        proxy_read_timeout 120s;
    }

    # The API's own probes, same origin, for a container healthcheck or an
    # uptime monitor that only has the UI's address.
    location = /health {
        proxy_pass http://api:8000/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://api:8000/ready;
        access_log off;
    }

    # Container-local liveness only. It does not depend on the API, so a broken
    # API is visible as a failing /ready rather than as a dead UI container.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
